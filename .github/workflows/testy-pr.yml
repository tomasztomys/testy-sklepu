name: Testy pull requesta

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: testy-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    services:
      sklep:
        image: ghcr.io/tomasztomys/sklep-cwiczeniowy:1.0
        env:
          SKLEP_DANE_STARTOWE: 'tak'
    env:
      BASE_URL: http://sklep:3000
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_HASLO: ${{ secrets.ADMIN_HASLO }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Instalacja zależności
        run: npm ci
      - name: Bramka jakości
        run: npm run check
      - name: Czekanie na sklep
        run: node scripts/czekaj-na-sklep.ts
      - name: Testy
        run: npm run test:pr
      - name: Raport HTML
        if: ${{ !cancelled() }}
        run: npx playwright merge-reports --reporter html ./blob-report
      - name: Zapis raportu
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: raport-pr
          path: playwright-report/
          retention-days: 14
