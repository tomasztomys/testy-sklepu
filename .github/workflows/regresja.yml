name: Nocna regresja

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    services:
      sklep:
        image: ghcr.io/tomasztomys/sklep-cwiczeniowy:1.0
        env:
          SKLEP_DANE_STARTOWE: 'tak'
    env:
      BASE_URL: http://sklep:3000
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_HASLO: ${{ secrets.ADMIN_HASLO }}
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/czekaj-na-sklep.ts
      - name: Testy (część ${{ matrix.shardIndex }} z ${{ matrix.shardTotal }})
        run: npx playwright test --grep-invert @kwarantanna --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  raport:
    if: ${{ !cancelled() }}
    needs: [testy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Statystyki
        if: ${{ !cancelled() }}
        run: node scripts/statystyki.ts
      - uses: actions/upload-artifact@v5
        with:
          name: raport-regresja-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
